<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090000">
<title>888 — Welcome</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #090000;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: -30%;
  background:
    radial-gradient(circle at 30% 35%,
      rgba(255,0,0,.23), transparent 35%),
    radial-gradient(circle at 75% 70%,
      rgba(180,0,0,.25), transparent 40%);
  animation: smoke 8s ease-in-out infinite alternate;
  pointer-events: none;
}

@keyframes smoke {
  from { transform: scale(1); }
  to { transform: scale(1.25); }
}

main {
  position: relative;
  max-width: 450px;
  margin: auto;
  padding: 65px 25px;
}

.logo {
  width: 220px;
  height: 220px;
  margin: 0 auto 30px;
  border: 3px solid #ff2020;
  border-radius: 50%;
  overflow: hidden;
  box-shadow: 0 0 35px #ff000080;
  animation: glow 3s infinite alternate;
  display: flex;
  align-items: center;
  justify-content: center;
}

.logo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

@keyframes glow {
  from { box-shadow: 0 0 15px #ff000060; }
  to { box-shadow: 0 0 45px #ff0000; }
}

h1 {
  font-size: 42px;
  letter-spacing: 5px;
  margin-bottom: 8px;
}

.subtitle {
  color: #ff7777;
  letter-spacing: 4px;
  margin-bottom: 40px;
}

.button {
  display: block;
  padding: 20px;
  margin: 18px 0;
  border: 1px solid #ff3030;
  border-radius: 15px;
  background: rgba(35,0,0,.85);
  color: white;
  text-decoration: none;
  font-size: 17px;
  font-weight: bold;
  letter-spacing: 2px;
  box-shadow: 0 0 18px #ff000040;
}

.button:active {
  background: #a00000;
}

.primary {
  background: #b80000;
}

footer {
  margin-top: 55px;
  color: #888;
  font-size: 12px;
}
</style>
</head>

<body>
<main>

  <div class="logo">
    <img src="IMG_3084.png" alt="888 Logo">
  </div>

  <h1>888</h1>
  <p class="subtitle">WELCOME</p>

  <a class="button primary"
     href="https://streamable.com/c/u8cxcu"
     target="_blank"
     rel="noopener noreferrer">
    🎬 SHOWROOM
  </a>

  <a class="button"
     href="https://www.instagram.com/john_one04/"
     target="_blank"
     rel="noopener noreferrer">
    📸 INSTAGRAM
  </a>

  <footer>© 888 — Official Website</footer>

</main>
</body>
</html>
